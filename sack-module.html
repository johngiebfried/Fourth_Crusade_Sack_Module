            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [choices, setChoices] = useState([]);
            const [character, setCharacter] = useState(null);
            const [scenario, setScenario] = useState(null);
            
            const startSack = () => {
                if (!characterId || !scenarioCode) {
                    alert('Please select your character and enter your scenario code!');
                    return;
                }
                
                const char = CHARACTERS.find(c => c.id === parseInt(characterId));
                const scen = SCENARIOS[scenarioCode.toUpperCase()];
                
                if (!char) {
                    alert('Invalid character selection!');
                    return;
                }
                
                if (!scen) {
                    alert(`Scenario code "${scenarioCode}" not found! Available: P1, P2, P3 (more coming soon)`);
                    return;
                }
                
                setCharacter(char);
                setScenario(scen);
                setChoices([]);
                setCurrentQuestion(0);
                setScreen('question');

            const makeChoice = (choiceLetter) => {
                const newChoices = [...choices, choiceLetter];
                setChoices(newChoices);
                
                if (currentQuestion < 2) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    // Generate result code
                    const charIdPadded = character.id.toString().padStart(2, '0');
                    const code = `${charIdPadded}${scenarioCode.toUpperCase()}${newChoices.join('')}`;
                    
                    // Calculate results
                    let totalMarks = 0;
                    let totalFama = 0;
                    let totalNefas = 0;

                        const choice = scenario.questions[qIndex].choices.find(c => c.letter === letter);
                        totalMarks += choice.marks;
                        totalFama += choice.fama;
                        totalNefas += choice.nefas;
                    });
                    
                    setScreen('results');
                }
            };

                let totalFama = 0;
                let totalNefas = 0;

                    totalMarks += choice.marks;
                    totalFama += choice.fama;
                    totalNefas += choice.nefas;
                });
                
                return { totalMarks, totalFama, totalNefas };
            };

                                        return (
                                            <div key={idx} className="border-l-4 border-amber-500 pl-4">
                                                <div className="font-bold text-amber-300">Question {idx + 1}: Choice {letter}</div>
                                                <div className="text-gray-300">{choice.text}</div>
                                                <div className="text-sm text-gray-400 mt-1">
                                                    +{choice.marks} marks, {choice.fama > 0 ? '+' : ''}{choice.fama} fama, {choice.nefas > 0 ? '+' : ''}{choice.nefas} nefas
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    setScreen('welcome');
                                    setCharacterId(null);
                                    setScenarioCode('');
                                    setChoices([]);
                                }}
                                className="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded text-lg"
                            >
                                ← Start New Sack
                            </button>
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.render(<SackModule />, document.getElementById('root'));
    </script>
</body>
</html>
